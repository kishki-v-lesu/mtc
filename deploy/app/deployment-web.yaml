---
# ServiceAccount приложения.
# Токен намеренно НЕ монтируется: приложению не нужно обращаться к API-серверу.
# Это сокращает последствия компрометации pod'а.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: mtc-demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: mtc-hack
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mtc-demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: mtc-hack
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Ни один запрос не должен попасть в недоступный pod при обновлении.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: mtc-hack
      annotations:
        # Принудительная перезагрузка ConfigMap при изменении конфигурации NGINX
        checksum/config: "changed-by-deploy-script"
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      # Pod Security: non-root, seccomp, drop всех capabilities
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Grace period + preStop: даём Kubernetes успеть убрать endpoint из
      # Service до остановки NGINX, иначе часть запросов получит 5xx.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        # ---------------------------------------------------------------- NGINX
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp

        # ------------------------------------------ nginx-prometheus-exporter
        # Читает nginx stub_status и отдаёт метрики в формате Prometheus.
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          imagePullPolicy: IfNotPresent
          args:
            - -nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
            - -web.listen-address=:9113
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        # ------------------------------------------------------- Filebeat
        # Читает access/error-логи NGINX из общего тома и отправляет их
        # в Elasticsearch. Уровень логирования: info.
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.5.4
          imagePullPolicy: IfNotPresent
          # command переопределяет ENTRYPOINT образа, поэтому имя бинарника
          # указываем явно: "filebeat filebeat ..." завершилось бы ошибкой.
          command: ["filebeat"]
          args:
            - -e
            - --strict.perms=false
            - -c
            - /usr/share/filebeat/filebeat.yml
          env:
            # Адрес хранилища логов. Полное DNS-имя обязательно: namespace
            # elasticsearch'а — ${APP_NAMESPACE} (mtc-demo), а не logging.
            # Секретов нет: Elasticsearch в стенде запущен без аутентификации
            # (см. README, раздел «Известные ограничения»).
            - name: ES_HOST
              value: "http://elasticsearch.mtc-demo.svc.cluster.local:9200"
          # Портов не объявляем: monitoring.enabled: false в filebeat.yml,
          # поэтому HTTP-эндпоинт мониторинга на 5066 не поднимается.
          # Объявленный порт без слушателя вводил бы в заблуждение.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: filebeat-data
              mountPath: /usr/share/filebeat/data
            - name: filebeat-config
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: web-nginx-config
            defaultMode: 0444
        # Доступ NGINX и Filebeat к одному и тому же файлу логов
        - name: nginx-logs
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: filebeat-data
          emptyDir:
            sizeLimit: 32Mi
        - name: filebeat-config
          configMap:
            name: filebeat-config
            defaultMode: 0444
