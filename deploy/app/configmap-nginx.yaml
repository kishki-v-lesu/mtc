---
# Конфигурация NGINX для демонстрационного приложения.
#
# Ключевые решения:
#  * listen 8080 — образ nginx-unprivileged по умолчанию не может слушать
#    порт < 1024, так как работает не от root;
#  * pid /tmp/nginx.pid и каталоги в /tmp,/var/cache/nginx — чтобы pod работал
#    с readOnlyRootFilesystem: true;
#  * access_log пишется в файл /var/log/nginx/access.log (а не в /dev/stdout),
#    потому что задание требует, чтобы access-логи были доступны для сбора
#    Filebeat/Fluentd; файл смонтирован в pod через emptyDir и разделяется
#    с контейнером-коллектором логов;
#  * log_format json — логи сразу в JSON, Filebeat разбирает их без regex.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-config
  namespace: mtc-demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: mtc-hack
data:
  nginx.conf: |
    worker_processes  auto;
    pid               /tmp/nginx.pid;
    error_log         /var/log/nginx/error.log warn;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        # JSON-формат: Filebeat читает каждую строку как готовый JSON-документ.
        #
        # ВАЖНО: имена полей не должны совпадать с ECS-объектами. В Elasticsearch
        # user_agent и host — объекты (user_agent.original, host.name), поэтому
        # строковое значение в корне даёт ошибку при bulk-индексации:
        # "object mapping for [user_agent] tried to parse field [user_agent]
        # as object, but found a concrete value". Поэтому user_agent и host
        # записываются под именами http_user_agent и nginx_host.
        log_format json_combined escape=json
            '{'
                '"@timestamp":"$time_iso8601",'
                '"remote_addr":"$remote_addr",'
                '"request_method":"$request_method",'
                '"request_uri":"$request_uri",'
                '"nginx_host":"$host",'
                '"status":$status,'
                '"body_bytes_sent":$body_bytes_sent,'
                '"request_length":$request_length,'
                '"request_time":$request_time,'
                '"referrer":"$http_referer",'
                '"http_user_agent":"$http_user_agent",'
                '"request_id":"$request_id"'
            '}';

        access_log  /var/log/nginx/access.log  json_combined;

        sendfile           on;
        tcp_nopush         on;
        server_tokens      off;
        keepalive_timeout  65;
        client_max_body_size 1m;

        server {
            listen      8080 default_server;
            server_name _;

            # Рабочая нагрузка: однозначно проверяемый ответ из задания.
            location / {
                default_type text/plain;
                add_header X-Request-Id $request_id always;
                add_header X-Served-By  "mtc-hack-web" always;
                return 200 "Hello World!\n";
            }

            # Health-check: не пишем в access-лог, чтобы поток логов не засорялся.
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # Источник метрик для nginx-prometheus-exporter
            # (модуль stub_status, входит в официальную сборку NGINX).
            location = /nginx_status {
                access_log off;
                stub_status;
            }
        }
    }
